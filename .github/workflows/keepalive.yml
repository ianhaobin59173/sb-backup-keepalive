name: SB备份兼保活

on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase auth health endpoint
        run: |
          URL="${SUPABASE_URL}/auth/v1/health"
          echo "Target: $URL"
          CODE=$(curl -s -o /tmp/body.txt -w "%{http_code}" "$URL" -H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}")
          echo "HTTP response code: $CODE"
          echo "Body: $(cat /tmp/body.txt)"
          if [ "$CODE" = "200" ]; then
            echo "OK - Supabase project is active and responding."
          else
            echo "WARNING - unexpected response code: $CODE"
          fi



















