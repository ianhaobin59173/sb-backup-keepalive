name: SB备份兼保活

on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase auth health endpoint
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          BASE="$(printf '%s' "$SB_URL" | tr -d '\r\n' | sed -e 's#/*$##')"
          KEY="$(printf '%s' "$SB_KEY" | tr -d '\r\n')"
          if [ -z "$BASE" ] || [ -z "$KEY" ]; then
            echo "FATAL: SUPABASE_URL or SUPABASE_KEY secret is missing or empty."
            exit 1
          fi
          URL="$BASE/auth/v1/health"
          CODE=$(curl -sS -o /tmp/body.txt -w "%{http_code}" "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY") || { echo "FATAL: curl could not send the request."; exit 2; }
          echo "HTTP response code: $CODE"
          echo "Response: $(cat /tmp/body.txt)"
          if [ "$CODE" = "200" ]; then
            echo "OK - Supabase project is active and responding."
          else
            echo "WARNING - unexpected response code: $CODE"
          fi
